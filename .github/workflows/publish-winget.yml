name: Publish to WinGet
on:
    release:
        types: [released]

jobs:
    publish:
        # Disabled: package not yet in winget-pkgs and 0.1.x has no binaries;
        # re-enable when binary assets ship.
        if: false
        runs-on: ubuntu-latest
        steps:
            - name: Publish to WinGet
              uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e
              with:
                  identifier: avalonreset.HyperYap
                  installers-regex: '\.(msi|exe)$'
                  token: ${{ secrets.WINGET_TOKEN }}
